; PlatformIO project for the Zinester firmware on the Seeed XIAO ESP32S3 Sense.
; Untested here — verify on hardware. (Arduino IDE works too; see README.)
[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; PSRAM + a partition scheme with room for the app. The frontend lives on the
; SD card, so app flash usage stays modest.
board_build.arduino.memory_type = qio_opi   ; enable OPI PSRAM
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    ; maintained async web server fork + its TCP dependency
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    bblanchon/ArduinoJson@^7
